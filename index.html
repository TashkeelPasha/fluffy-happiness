<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>AAK Advisory — Aamir Ahsan Khan · Capital · Governance · Forensic Audit</title>
    <meta
      name="description"
      content="AAK Advisory — forensic audit, corporate governance, capital mandates, and non-executive directorships across the UK, Pakistan, the GCC and the United States. Mandates accepted on a confidential basis."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="AAK Advisory — Aamir Ahsan Khan" />
    <meta
      property="og:description"
      content="Forensic audit, corporate governance, capital mandates, non-executive directorships. UK · Pakistan · GCC · USA. Mandates accepted on a confidential basis."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- JSON-LD: Organization + Person (graph) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://aamirahsankhan.me/#org",
            "name": "AAK Advisory",
            "url": "https://aamirahsankhan.me/",
            "founder": { "@id": "https://aamirahsankhan.me/#person" },
            "knowsAbout": [
              "Forensic Audit",
              "Corporate Governance",
              "Capital Advisory",
              "Non-Executive Directorship",
              "Data Centre Strategy",
              "Marine Engineering"
            ],
            "areaServed": ["United Kingdom", "Pakistan", "Bahrain", "United States"]
          },
          {
            "@type": "Person",
            "@id": "https://aamirahsankhan.me/#person",
            "name": "Aamir Ahsan Khan",
            "jobTitle": "Principal · AAK Advisory",
            "address": [
              { "@type": "PostalAddress", "addressLocality": "Karachi", "addressCountry": "Pakistan" },
              { "@type": "PostalAddress", "addressLocality": "London", "addressCountry": "United Kingdom" }
            ],
            "worksFor": { "@id": "https://aamirahsankhan.me/#org" },
            "alumniOf": [
              { "@type": "EducationalOrganization", "name": "South Shields Marine School" },
              { "@type": "EducationalOrganization", "name": "Postgraduate Institute of Management (PIM)" }
            ],
            "award": "Human Rights Ambassador — International Human Rights Commission, 2011",
            "knowsAbout": [
              "Forensic Audit",
              "Corporate Governance",
              "Capital Mandates",
              "Data Centre Strategy",
              "Building Management Systems",
              "Marine Engineering"
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <!-- Preloader -->
    <div id="preloader" aria-hidden="true" role="status" aria-live="polite">
      <div class="preloader__inner">
        <div class="preloader__top">
          <span class="preloader__brand serif-italic">AAK Advisory</span>
          <span class="preloader__label mono">— Loading</span>
        </div>

        <div class="preloader__count">
          <span class="preloader__counter serif-italic">00</span>
          <span class="preloader__suffix mono">%</span>
        </div>

        <div class="preloader__bar" aria-hidden="true">
          <span class="preloader__bar-fill"></span>
        </div>

        <span class="preloader__status mono">Preparing the practice</span>
      </div>
      <div class="preloader__veil"></div>
    </div>

    <!-- Nav mounts here -->
    <header id="nav" class="nav" role="banner"></header>

    <main id="main">
      <section id="hero" class="section section--hero" aria-labelledby="hero-name"></section>
      <section id="numbers" class="section section--numbers" aria-labelledby="numbers-title"></section>
      <section id="announcement" class="section section--announcement" aria-label="Africa venture"></section>
      <section id="cases" class="section section--cases" aria-labelledby="cases-title"></section>
      <section id="about" class="section section--about" aria-labelledby="about-title"></section>
      <section id="manifesto" class="section section--manifesto section--dark" aria-labelledby="manifesto-title"></section>
      <section id="services" class="section section--services section--dark" aria-labelledby="services-title"></section>
      <section id="experience" class="section section--experience" aria-labelledby="experience-title"></section>
      <section id="networks" class="section section--networks section--dark" aria-labelledby="networks-title"></section>
      <section id="recognition" class="section section--recognition" aria-labelledby="recognition-title"></section>
      <section id="independence" class="section section--independence" aria-labelledby="independence-title"></section>
      <section id="education" class="section section--education section--tight" aria-labelledby="education-title"></section>
      <section id="contact" class="section section--contact" aria-labelledby="contact-title"></section>
    </main>

    <footer id="footer" class="footer" role="contentinfo"></footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
